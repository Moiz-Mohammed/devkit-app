services:
  postgres:
    image: postgres:15-alpine
    container_name: devkit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devkit
      POSTGRES_PASSWORD: devkit_password
      POSTGRES_DB: devkit_db
    ports:
      - '5432:5432'
    volumes:
      - devkit_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devkit_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - devkit_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  devkit_postgres_data:
  devkit_redis_data:
